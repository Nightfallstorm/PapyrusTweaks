name: Build PapyrusTweaks for Skyrim 1.7.104

on:
  workflow_dispatch:
  push:
    branches:
      - skyrim-1.7.104-port
    paths-ignore:
      - '**/*.md'

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install vcpkg
        shell: pwsh
        run: |
          $vcpkg = Join-Path $env:RUNNER_TEMP 'vcpkg'
          git clone https://github.com/microsoft/vcpkg.git $vcpkg
          & "$vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=$vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_INSTALLATION_ROOT=$vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure
        shell: pwsh
        run: cmake --preset papyrustweaks

      - name: Build Release
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Locate DLL and package Vortex ZIP
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path build -Filter PapyrusTweaks.dll -Recurse | Select-Object -First 1
          if (-not $dll) {
            Write-Error 'PapyrusTweaks.dll was not produced by the build.'
            exit 1
          }

          New-Item -ItemType Directory -Force -Path package\SKSE\Plugins | Out-Null
          Copy-Item $dll.FullName package\SKSE\Plugins\PapyrusTweaks.dll

          @"
          Papyrus Tweaks NG test build
          Target Skyrim runtime: 1.7.104.0
          Target SKSE: 2.3.1
          CommonLibSSE-NG: 7.2.0
          Address Library: format 5 / runtime 1.7.104.0
          Source branch: skyrim-1.7.104-port
          Commit: $env:GITHUB_SHA
          "@ | Set-Content -Path package\BUILD_INFO.txt -Encoding utf8

          Compress-Archive -Path package\* -DestinationPath PapyrusTweaks-Skyrim-1.7.104-Test.zip -Force

      - name: Upload Vortex-ready ZIP
        uses: actions/upload-artifact@v4
        with:
          name: PapyrusTweaks-Skyrim-1.7.104-Test
          path: PapyrusTweaks-Skyrim-1.7.104-Test.zip
          if-no-files-found: error
          retention-days: 14
